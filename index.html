<script>
(()=>{'use strict';

/* ===== НАСТРОЙКИ SUPABASE ===== */
const SUPABASE_URL = 'https://mfiadeomygsspaytpjcp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1maWFkZW9teWdzc3BheXRwamNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NDUwMTcsImV4cCI6MjEwNzEyMTAxN30.trMMeU38RqUYUI4u2wBrpu3iz9kYdfzieN3c3AguG00';
const SUPABASE_TABLE = 'finance_state';
const SUPABASE_ID = 'default';
const CLOUD_SAVE_DELAY = 2000;

const KEY = 'business_finances_v1';
const FIRST = '2026-09';
const AUTOSAVE_KEY = 'finance_autosave_settings_v1';

const baseCats = [
  ['rent','Аренда помещения'],
  ['utilities','Коммунальные услуги'],
  ['internet','Интернет'],
  ['payroll','Зарплаты'],
  ['senet','Подписка SENET'],
  ['ccboot','Подписка CCBoot'],
  ['drinks','Закупка напитков'],
  ['bakery','Закупка выпечки'],
  ['cleaning','Расходники для уборки']
];

const initial = () => ({
  settings: { name:'Бласт', tax:3, social:21675, schemaVersion:5, shares:[25,25,25,25], defaults:{} },
  months: { [FIRST]: blank() }
});

function blank(){
  return {
    kaspi:0, online:0, encashment:0,
    custom:[], employees:[],
    shares:[25,25,25,25],
    ...Object.fromEntries(baseCats.map(([k])=>[k,0]))
  };
}

let state;
try {
  state = JSON.parse(localStorage.getItem(KEY)) || initial();
  if (!state.settings || !state.months) throw Error('bad');
} catch { state = initial(); }

if (!Number.isFinite(Number(state.settings.schemaVersion)) || Number(state.settings.schemaVersion) < 2){
  state.settings.social = 21675;
  state.settings.schemaVersion = 2;
}
state.settings.defaults ??= {};
state.settings.shares = validShares(state.settings.shares);
for (const m of Object.values(state.months)) m.shares = validShares(m.shares);
state.settings.schemaVersion = 5;

let current = Object.keys(state.months).sort().at(-1) || FIRST;
let tab = 'dashboard', range = 'year', start = FIRST, end = current;

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n||0))+' ₸';
const num = n => Math.max(0, Number(n) || 0);
const pct = (n,d) => d ? ((n/d)*100).toFixed(1)+'%' : '0%';
const fmt = m => new Date(m+'-01T12:00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
const short = m => new Date(m+'-01T12:00:00').toLocaleDateString('ru-RU',{month:'short',year:'2-digit'});
const add = (m,n=1) => { const [y,mm]=m.split('-').map(Number); return new Date(Date.UTC(y,mm-1+n,1)).toISOString().slice(0,7); };
const monthList = () => Object.keys(state.months).filter(m=>m>=FIRST).sort();

const moneyShare = n => new Intl.NumberFormat('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2}).format(Math.round((n+Number.EPSILON)*100)/100)+' ₸';
const showPct = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n)+'%';

const shareNames = ['Жасталап','Асылхан','Дамир','На улучшение клуба'];
const shareColors = ['#7393ff','#65dfb5','#ffb978','#b49bff'];

function validShares(v){
  if (!Array.isArray(v) || v.length !== 4) return [25,25,25,25];
  const a = v.map(Number);
  return a.every(x=>Number.isFinite(x)&&x>=0&&x<=100) && Math.abs(a.reduce((x,y)=>x+y,0)-100)<.000001 ? a : [25,25,25,25];
}
function sharesOf(m){ return validShares(state.months[m]?.shares ?? state.settings.shares); }
function payrollTotal(m){ return (state.months[m]?.employees||[]).reduce((a,e)=>a+num(e.salary),0); }
function syncPayroll(m){ if (state.months[m]) state.months[m].payroll = payrollTotal(m); }

function normalizeEmployees(){
  for (const [m,d] of Object.entries(state.months)){
    if (!Array.isArray(d.employees)){
      const oldPay = num(d.payroll);
      d.employees = oldPay ? [{id:'imported-'+m, name:'Зарплаты (перенесено)', salary:oldPay}] : [];
    } else {
      d.employees = d.employees.filter(e=>e&&typeof e==='object').map((e,i)=>({
        id: String(e.id||'employee-'+i),
        name: String(e.name??'Сотрудник'),
        salary: num(e.salary)
      }));
    }
    syncPayroll(m);
  }
}
normalizeEmployees();

function stats(m){
  const d = state.months[m] || blank();
  const inc = num(d.kaspi)+num(d.online)+num(d.encashment);
  const ops = baseCats.reduce((s,[k])=>s+(k==='payroll'?payrollTotal(m):num(d[k])),0)
            + (d.custom||[]).reduce((s,c)=>s+num(c.value),0);
  const tax = inc * num(state.settings.tax) / 100;
  const social = num(state.settings.social);
  return {
    inc, ops, tax, social,
    expense: ops+tax+social,
    profit: inc-ops-tax-social,
    margin: inc ? (inc-ops-tax-social)/inc*100 : 0,
    kaspi: num(d.kaspi), online: num(d.online), encashment: num(d.encashment)
  };
}
const sum = ms => ms.reduce((a,m)=>{
  const s = stats(m);
  Object.keys(a).forEach(k => a[k] += s[k]||0);
  return a;
}, {inc:0,ops:0,tax:0,social:0,expense:0,profit:0,kaspi:0,online:0,encashment:0});

function allocation(s,m){
  const totalCents = Math.max(0, Math.round(s.profit*100));
  const percents = sharesOf(m);
  const raw = percents.map(p => totalCents*p/100);
  const cents = raw.map(Math.floor);
  const rest = totalCents - cents.reduce((x,y)=>x+y,0);
  const order = [0,1,2,3].sort((a,b)=>(raw[b]-cents[b])-(raw[a]-cents[a])||a-b);
  for (let i=0;i<rest;i++) cents[order[i%4]]++;
  return { distributable: totalCents/100, shares: cents.map(c=>c/100), percents };
}
function allocationsFor(ms){
  const shares = [0,0,0,0];
  let losses = 0;
  for (const m of ms){
    const s = stats(m), a = allocation(s,m);
    a.shares.forEach((v,i)=>shares[i]+=v);
    losses += Math.max(0,-s.profit);
  }
  return { shares: shares.map(v=>Math.round(v*100)/100), total: Math.round(shares.reduce((a,b)=>a+b,0)*100)/100, losses };
}

/* ===== SUPABASE ===== */
const cloudStatusEl = document.getElementById('cloudStatus');
const cloudTextEl = document.getElementById('cloudText');
function setCloudStatus(kind, text){
  if (!cloudStatusEl) return;
  cloudStatusEl.className = 'cloud-status ' + kind;
  if (cloudTextEl) cloudTextEl.textContent = text;
}

async function loadFromCloud(){
  try {
    setCloudStatus('saving', 'Загрузка…');
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${SUPABASE_ID}&select=data,updated_at`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    if (!rows.length || !rows[0].data || Object.keys(rows[0].data).length === 0){
      setCloudStatus('saving', 'Первичная загрузка…');
      await saveToCloud(true);
      return;
    }
    const cloudData = rows[0].data;
    const cloudTime = new Date(rows[0].updated_at).getTime();
    const localTime = Number(localStorage.getItem(KEY+'_ts') || 0);
    if (cloudTime >= localTime){
      state = cloudData;
      if (!Number.isFinite(Number(state.settings.schemaVersion)) || Number(state.settings.schemaVersion)<2){
        state.settings.social = 21675;
        state.settings.schemaVersion = 2;
      }
      state.settings.defaults ??= {};
      state.settings.shares = validShares(state.settings.shares);
      for (const d of Object.values(state.months)) d.shares = validShares(d.shares);
      state.settings.schemaVersion = 5;
      normalizeEmployees();
      current = monthList().at(-1) || FIRST;
      localStorage.setItem(KEY, JSON.stringify(state));
      localStorage.setItem(KEY+'_ts', cloudTime);
      render();
      setCloudStatus('synced', 'Данные из облака');
    } else {
      await saveToCloud(true);
    }
  } catch (e){
    console.error('loadFromCloud error', e);
    setCloudStatus('error', 'Ошибка загрузки');
  }
}

let cloudSaveTimer = null;
async function saveToCloud(force=false){
  if (cloudSaveTimer){ clearTimeout(cloudSaveTimer); cloudSaveTimer = null; }
  try {
    setCloudStatus('saving', 'Сохранение…');
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${SUPABASE_ID}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ data: state, updated_at: new Date().toISOString() })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    localStorage.setItem(KEY+'_ts', Date.now());
    setCloudStatus('synced', 'Синхронизировано');
  } catch (e){
    console.error('saveToCloud error', e);
    setCloudStatus('error', 'Ошибка сохранения');
  }
}

function scheduleCloudSave(){
  if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(()=>saveToCloud(true), CLOUD_SAVE_DELAY);
}

function save(){
  state.settings.shares = validShares(state.settings.shares);
  localStorage.setItem(KEY, JSON.stringify(state));
  localStorage.setItem(KEY+'_ts', Date.now());
  const brand = document.getElementById('brand');
  if (brand) brand.textContent = state.settings.name || 'Бласт';
  scheduleCloudSave();
}

const DEFAULT_AUTOSAVE = { enabled:false, intervalDays:3, lastSaved:0 };
function getAutosaveSettings(){
  try {
    const s = JSON.parse(localStorage.getItem(AUTOSAVE_KEY));
    return Object.assign({}, DEFAULT_AUTOSAVE, s||{});
  } catch { return {...DEFAULT_AUTOSAVE}; }
}
function setAutosaveSettings(patch){
  const s = Object.assign(getAutosaveSettings(), patch);
  localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(s));
  return s;
}
function downloadJSON(){
  const content = JSON.stringify(state, null, 2);
  const blob = new Blob([content], {type:'application/json'});
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const name = `finance-autosave-${d.toISOString().slice(0,10)}.json`;
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  setAutosaveSettings({lastSaved: Date.now()});
}
function checkAutosave(){
  const s = getAutosaveSettings();
  if (!s.enabled) return;
  const elapsedDays = (Date.now() - s.lastSaved) / (1000*60*60*24);
  if (elapsedDays >= s.intervalDays){ downloadJSON(); }
}

function period(){
  const ms = monthList();
  if (range === 'all') return ms;
  if (range === 'custom') return ms.filter(m => m>=start && m<=end);
  if (range === 'month') return ms.filter(m => m===current);
  if (range === 'quarter'){
    const [y,mo] = current.split('-').map(Number);
    const q = Math.floor((mo-1)/3);
    return ms.filter(m => m.slice(0,4)===String(y) && Math.floor((Number(m.slice(5))-1)/3)===q);
  }
  if (range === 'half'){
    const [y,mo] = current.split('-').map(Number);
    const h = Math.floor((mo-1)/6);
    return ms.filter(m => m.slice(0,4)===String(y) && Math.floor((Number(m.slice(5))-1)/6)===h);
  }
  return ms.filter(m => m.slice(0,4)===current.slice(0,4));
}

function chart(ms){
  if (!ms.length) return '<div class="empty">Нет данных за период</div>';
  const W=700,H=270,left=54,right=12,top=20,bottom=42;
  const iw=W-left-right, ih=H-top-bottom;
  const mx = Math.max(1, ...ms.flatMap(m=>{const s=stats(m);return [s.inc,s.profit];}));
  const mn = Math.min(0, ...ms.map(m=>stats(m).profit));
  const span = Math.max(1, mx-mn);
  const x = i => left + (ms.length===1 ? iw/2 : i*iw/(ms.length-1));
  const y = v => top + (mx-v)/span*ih;
  const line = k => ms.map((m,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(stats(m)[k]).toFixed(1)}`).join(' ');
  const ticks = [0,.25,.5,.75,1].map(t=>{
    const v = mn+(mx-mn)*t, Y = y(v);
    return `<line x1="${left}" y1="${Y}" x2="${W-right}" y2="${Y}" stroke="#304058" stroke-dasharray="4 6"/><text x="${left-9}" y="${Y+4}" text-anchor="end">${money(v).replace(' ₸','')}</text>`;
  }).join('');
  const labels = ms.filter((m,i)=>ms.length<=12||i%Math.ceil(ms.length/12)===0).map(m=>`<text x="${x(ms.indexOf(m))}" y="${H-12}" text-anchor="middle">${short(m)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График доходов и прибыли">
    ${ticks}
    <line x1="${left}" y1="${y(0)}" x2="${W-right}" y2="${y(0)}" stroke="#63738d"/>
    <path d="${line('inc')}" fill="none" stroke="#7393ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="${line('profit')}" fill="none" stroke="#65dfb5" stroke-width="3" stroke-linejoin="round"/>
    ${ms.map((m,i)=>`<circle cx="${x(i)}" cy="${y(stats(m).inc)}" r="4.5" fill="#7393ff"><title>${fmt(m)} · Доход ${money(stats(m).inc)}</title></circle><circle cx="${x(i)}" cy="${y(stats(m).profit)}" r="4.5" fill="#65dfb5"><title>${fmt(m)} · Прибыль ${money(stats(m).profit)}</title></circle>`).join('')}
    ${labels}
  </svg>
  <div class="legend"><span><i class="dot" style="background:#7393ff"></i>Доходы</span><span><i class="dot" style="background:#65dfb5"></i>Чистая прибыль</span></div>`;
}

function expLines(ms){
  const rows = baseCats.map(([k,name])=>({
    name,
    value: ms.reduce((a,m)=>a+(k==='payroll'?payrollTotal(m):num(state.months[m][k])),0)
  }));
  const social = num(state.settings.social)*ms.length;
  const tax = ms.reduce((a,m)=>a+stats(m).tax,0);
  rows.push({name:'Социальные отчисления', value:social});
  rows.push({name:'Резерв налога', value:tax});
  for (const m of ms){
    for (const c of state.months[m].custom||[]){
      const found = rows.find(r=>r.name===c.name);
      if (found) found.value += num(c.value);
      else rows.push({name:c.name||'Дополнительный расход', value:num(c.value)});
    }
  }
  return rows.filter(r=>r.value>0).sort((a,b)=>b.value-a.value);
}

function render(){
  save();
  const ms = $('#monthSelect');
  if (ms) ms.innerHTML = monthOptions();
  const tc = $('#top-controls');
  if (tc) tc.classList.toggle('hidden', tab==='settings');

  const titles = {
    dashboard:'Финансовая панель',
    months:'История месяцев',
    analytics:'Аналитика по периодам',
    employees:'Сотрудники',
    settings:'Настройки'
  };
  const subs = {
    dashboard:'Операции, расходы и прибыль',
    months:'Сравнение периодов и налоговых резервов',
    analytics:'Динамика финансовых результатов',
    employees:'Учёт сотрудников и расчёт фонда оплаты труда',
    settings:'Параметры учёта и синхронизация'
  };

  const topBar = document.getElementById('topBar');
  const topTitle = document.getElementById('topTitle');
  const showTop = true;
  if (topBar) topBar.style.display = showTop ? '' : 'none';

  const pt = $('#page-title'), ps = $('#page-sub');
  if (pt) pt.textContent = titles[tab];
  if (ps) ps.textContent = subs[tab];

  $$('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  const content = $('#content');
  if (!content) return;
  content.innerHTML =
    tab==='dashboard' ? monthEditor() :
    tab==='months' ? monthsPage() :
    tab==='analytics' ? analyticsPage() :
    tab==='employees' ? employeesPage() :
    settingsPage();
}

function makeNext(){
  const last = monthList().at(-1) || FIRST;
  const next = add(last);
  state.months[next] = {
    ...blank(),
    shares: validShares(state.settings.shares),
    ...Object.fromEntries(baseCats.filter(([k])=>k!=='payroll').map(([k])=>[k, num(state.settings.defaults[k])])),
    employees: (state.months[last].employees||[]).map(e=>({...e}))
  };
  syncPayroll(next);
  current = next;
  tab = 'dashboard';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function fileDownload(content, name, type){
  const a = document.createElement('a');
  const url = URL.createObjectURL(new Blob([content], {type}));
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function csv(){
  const keys = ['month','kaspi','online','encashment',...baseCats.map(x=>x[0]),'employees','custom','taxReserve','social','totalIncome','totalExpense','netProfit',...['zhastalap','asylkhan','damir','club_improvements'].map(x=>x+'_pct'),...['zhastalap','asylkhan','damir','club_improvements'].map(x=>x+'_amount')];
  const rows = [keys.join(';')];
  for (const m of monthList()){
    const d = state.months[m], s = stats(m);
    const vals = [m, d.kaspi, d.online, num(d.encashment), ...baseCats.map(([k])=>k==='payroll'?payrollTotal(m):d[k]), (d.employees||[]).map(e=>e.name+': '+e.salary).join(' | '), (d.custom||[]).map(c=>c.name+': '+c.value).join(' | '), s.tax, s.social, s.inc, s.expense, s.profit, ...sharesOf(m), ...allocation(s,m).shares];
    rows.push(vals.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';'));
  }
  return '\ufeff'+rows.join('\r\n');
}

function shareEditorValues(selector){
  const items = [...document.querySelectorAll(selector)];
  if (items.length !== 4) return null;
  return items.map(el => el.value.trim()==='' ? NaN : Number(el.value));
}
function shareEditorValid(v){
  return v?.length===4
    && v.every(x=>Number.isFinite(x)&&x>=0&&x<=100&&Math.abs(Math.round(x*100)-x*100)<1e-6)
    && Math.abs(v.reduce((x,y)=>x+y,0)-100)<.000001;
}
function previewShares(kind){
  const monthly = kind==='month';
  const vals = shareEditorValues(monthly?'[data-share]':'[data-default-share]');
  const sum = vals?.reduce((a,b)=>a+b,0);
  const valid = shareEditorValid(vals);
  const label = document.getElementById(monthly?'shareValidation':'defaultShareValidation');
  const btn = document.getElementById(monthly?'saveShares':'saveDefaultShares');
  if (!label || !btn) return;
  label.classList.toggle('invalid', !valid);
  label.textContent =
    !vals?.every(Number.isFinite) ? 'Введите все четыре процента.' :
    !vals.every(v=>v>=0&&v<=100) ? 'Каждая доля должна быть от 0% до 100%.' :
    !vals.every(v=>Math.round(v*100)===v*100) ? 'Максимум два знака после запятой.' :
    'Сумма: '+showPct(sum)+(valid?' — готово к сохранению.':' — необходимо ровно 100%.');
  btn.disabled = !valid;
  if (monthly && vals?.every(Number.isFinite)){
    const total = Math.max(0, stats(current).profit);
    vals.forEach((v,i)=>{
      const el = document.querySelector(`[data-share-amount="${i}"]`);
      const span = document.querySelector(`[data-share-track="${i}"]`);
      if (el) el.textContent = moneyShare(total * Math.max(0,v)/100);
      if (span) span.style.width = Math.max(0,Math.min(100,v))+'%';
    });
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-open],[data-employee-open]');
  if (!b) return;
  if (b.dataset.tab){
    if (b.dataset.payrollJump==='latest') current = monthList().at(-1)||FIRST;
    tab = b.dataset.tab; render(); window.scrollTo(0,0);
  }
  else if (b.dataset.employeeOpen){ current = b.dataset.employeeOpen; tab='employees'; render(); window.scrollTo(0,0); }
  else if (b.dataset.open){ current = b.dataset.open; tab='dashboard'; range='month'; render(); window.scrollTo(0,0); }
  else if (b.id==='newMonth' || b.id==='addMonths') makeNext();
  else if (b.id==='addEmployee' || b.id==='addEmployeeEmpty'){
    state.months[current].employees.push({id:'emp-'+Date.now()+'-'+state.months[current].employees.length, name:'Новый сотрудник', salary:0});
    syncPayroll(current); render();
    [...document.querySelectorAll('[data-employee-name]')].at(-1)?.focus();
  }
  else if (b.id==='openLatestPayroll'){ current = monthList().at(-1)||FIRST; tab='employees'; render(); }
  else if (b.dataset.removeEmployee!==undefined){
    const i = Number(b.dataset.removeEmployee);
    const staff = state.months[current].employees;
    if (staff[i] && confirm('Убрать «'+staff[i].name+'» из зарплат за '+fmt(current)+'?')){
      staff.splice(i,1); syncPayroll(current); render();
    }
  }
  else if (b.id==='addExpense'){ (state.months[current].custom ??= []).push({name:'Новый расход', value:0}); render(); }
  else if (b.dataset.remove!==undefined){ state.months[current].custom.splice(Number(b.dataset.remove),1); render(); }
  else if (b.id==='editShares'){ document.getElementById('shareEditor')?.scrollIntoView({behavior:'smooth', block:'start'}); }
  else if (b.id==='saveShares'){
    const v = shareEditorValues('[data-share]');
    if (shareEditorValid(v)){ state.months[current].shares = v; state.settings.shares = v.slice(); render(); }
  }
  else if (b.id==='saveDefaultShares'){
    const v = shareEditorValues('[data-default-share]');
    if (shareEditorValid(v)){ state.settings.shares = v; render(); }
  }
  else if (b.id==='exportJson') fileDownload(JSON.stringify(state,null,2), 'finance-backup-'+new Date().toISOString().slice(0,10)+'.json', 'application/json');
  else if (b.id==='exportCsv') fileDownload(csv(), 'finance-report.csv', 'text/csv;charset=utf-8');
  else if (b.id==='importJson') $('#importFile').click();
  else if (b.id==='syncNow'){ saveToCloud(true); }
  else if (b.id==='loadCloud'){ if (confirm('Загрузить данные из облака? Локальные изменения будут перезаписаны, если облако новее.')) loadFromCloud(); }
  else if (b.id==='pushCloud'){ if (confirm('Выгрузить локальные данные в облако? Данные в облаке будут перезаписаны.')) saveToCloud(true); }
  else if (b.id==='downloadNow') downloadJSON();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id==='monthSelect'){ current = t.value; render(); }
  else if (t.id==='dashMonthSelect'){ current = t.value; render(); }
  else if (t.id==='period'){ range = t.value; render(); }
  else if (t.id==='start'){ start = t.value; render(); }
  else if (t.id==='end'){ end = t.value; render(); }
  else if (t.id==='businessName'){ state.settings.name = t.value.trim() || 'Бласт'; render(); }
  else if (t.id==='taxRate'){ state.settings.tax = Math.min(100, num(t.value)); render(); }
  else if (t.id==='social'){ state.settings.social = num(t.value); render(); }
  else if (t.id==='autosaveEnabled'){ setAutosaveSettings({enabled: t.checked}); render(); }
  else if (t.id==='autosaveInterval'){ setAutosaveSettings({intervalDays: Number(t.value)}); render(); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.share!==undefined){ previewShares('month'); return; }
  else if (t.dataset.defaultShare!==undefined){ previewShares('default'); return; }
  else if (t.dataset.employeeName!==undefined){
    const i = Number(t.dataset.employeeName);
    const item = state.months[current].employees[i];
    if (item){ item.name = t.value; save(); }
    return;
  }
  else if (t.dataset.employeeSalary!==undefined){
    const i = Number(t.dataset.employeeSalary);
    const item = state.months[current].employees[i];
    if (item){
      item.salary = num(t.value);
      syncPayroll(current);
      save();
      document.querySelectorAll('[data-payroll-total]').forEach(el=>el.textContent = money(payrollTotal(current)));
      document.querySelectorAll('[data-payroll-average]').forEach(el=>el.textContent = money(payrollTotal(current)/Math.max(1, state.months[current].employees.length)));
    }
    return;
  }
  else if (t.dataset.input){
    const k = t.dataset.input;
    if (k.startsWith('default-')) state.settings.defaults[k.replace('default-','')] = num(t.value);
    else state.months[current][k] = num(t.value);
    save();
    if (tab==='dashboard'){
      const st = stats(current);
      const cards = [...$('#content').querySelectorAll('.kpis')].at(-1);
      if (cards){
        const v = cards.querySelectorAll('.value');
        if (v.length===4){
          v[0].textContent = money(st.inc);
          v[1].textContent = money(st.expense);
          v[2].textContent = money(st.tax);
          v[3].textContent = money(st.profit);
        }
      }
      const mI = $('#monthlyIncome'), mT = $('#monthlyTax');
      if (mI) mI.textContent = money(st.inc);
      if (mT) mT.textContent = money(st.tax);
      const strips = $('#content').querySelectorAll('.total-strip');
      if (strips.length) strips[strips.length-1].lastElementChild.textContent = money(st.expense);
    }
    clearTimeout(window.__refresh);
    window.__refresh = setTimeout(()=>{
      if (document.activeElement !== t) render();
      else {
        const sel = t.selectionStart;
        render();
        const nt = document.querySelector(`[data-input="${k}"]`);
        if (nt){ nt.focus(); try { nt.setSelectionRange(sel,sel); } catch {} }
      }
    }, 450);
  }
  else if (t.dataset.customValue!==undefined){
    const i = +t.dataset.customValue;
    state.months[current].custom[i].value = num(t.value);
    save();
    clearTimeout(window.__refresh);
    window.__refresh = setTimeout(()=>{ render(); const nt = document.querySelector(`[data-custom-value="${i}"]`); if (nt) nt.focus(); }, 450);
  }
  else if (t.dataset.customName!==undefined){
    const i = +t.dataset.customName;
    state.months[current].custom[i].name = t.value;
    save();
    clearTimeout(window.__refresh);
    window.__refresh = setTimeout(()=>{
      render();
      const nt = document.querySelector(`[data-custom-name="${i}"]`);
      if (nt){ nt.focus(); nt.setSelectionRange(t.selectionStart??nt.value.length, t.selectionStart??nt.value.length); }
    }, 550);
  }
});

$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const v = JSON.parse(await f.text());
    if (!v.settings || !v.months || typeof v.months!=='object' || !Object.keys(v.months).length) throw Error('Неверная структура');
    if (!confirm('Заменить все текущие данные данными из файла?')) return;
    state = v;
    if (!Number.isFinite(Number(state.settings.schemaVersion)) || Number(state.settings.schemaVersion)<2){
      state.settings.social = 21675;
      state.settings.schemaVersion = 2;
    }
    state.settings.defaults ??= {};
    state.settings.shares = validShares(state.settings.shares);
    for (const d of Object.values(state.months)) d.shares = validShares(d.shares);
    state.settings.schemaVersion = 5;
    normalizeEmployees();
    current = monthList().at(-1) || FIRST;
    render();
    saveToCloud(true);
    alert('Данные восстановлены');
  } catch (err){
    alert('Не удалось импортировать файл: '+err.message);
  } finally {
    e.target.value = '';
  }
});

setInterval(checkAutosave, 60*60*1000);

(async function init(){
  render();
  await loadFromCloud();
  checkAutosave();
  document.addEventListener('visibilitychange', ()=>{
    if (!document.hidden) loadFromCloud();
  });
})();

})();
</script>
</body>
</html>
