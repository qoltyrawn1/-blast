<style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#e8edf6;background:#0b1220;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7c9cff;outline-offset:2px}

/* Распределение чистой прибыли */

.employee-total{font-size:clamp(25px,3vw,36px);font-weight:760;color:#66dfb0;margin-top:8px;font-variant-numeric:tabular-nums}
.employee-empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:40px 18px;border:1px dashed #3d516e;border-radius:13px;color:#9fb1cb;margin-top:16px}

.employee-empty .ico{font-size:32px}

/* Cloud & Autosave settings */
.cloud-box{border:1px solid #30435e;background:#111e31;border-radius:13px;padding:18px;margin-top:18px}
.cloud-box h3{margin:0 0 10px;font-size:15px}
.cloud-box .controls{margin-top:14px}
.cloud-box label{display:flex;align-items:center;gap:10px;font-size:13px;color:#becbe0;padding:8px 0;cursor:pointer}
.cloud-box input[type=checkbox]{width:18px;height:18px;accent-color:#5b77e9}

@media(max-width:1060px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}

@media(max-width:410px){.kpis,.rows{grid-template-columns:1fr}}
@media(max-width:1000px){.split-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:500px){.split-box{padding:15px}.split-grid{grid-template-columns:1fr 1fr;gap:8px}.split-card{padding:12px}.split-card .split-amount{font-size:16px}}
@media(max-width:365px){.split-grid{grid-template-columns:1fr}}

@media(max-width:600px){.employee-person{grid-template-columns:38px minmax(0,1fr) 34px;gap:9px}.employee-avatar{width:38px;height:38px}.employee-person .salary-field{grid-column:2;grid-row:2}.employee-remove{grid-column:3;grid-row:1;align-self:end}.employee-person .name-field{grid-column:2;grid-row:1}}
</style>

<script>
(()=>{'use strict';

/* ===== НАСТРОЙКИ SUPABASE ===== */
const SUPABASE_URL = 'https://mfiadeomygsspaytpjcp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1maWFkZW9teWdzc3BheXRwamNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NDUwMTcsImV4cCI6MjEwNzEyMTAxN30.trMMeU38RqUYUI4u2wBrpu3iz9kYdfzieN3c3AguG00';
const SUPABASE_TABLE = 'finance_state';
const SUPABASE_ID = 'default';
const CLOUD_SAVE_DELAY = 2000; // задержка перед сохранением в облако, мс

const KEY = 'business_finances_v1';
const FIRST = '2026-10';
const AUTOSAVE_KEY = 'finance_autosave_settings_v1';

const baseCats = [
  ['rent','Аренда помещения'],
  ['utilities','Коммунальные услуги'],
  ['internet','Интернет'],
  ['payroll','Зарплаты'],
  ['senet','Подписка SENET'],
  ['ccboot','Подписка CCBoot'],
  ['drinks','Закупка напитков'],
  ['bakery','Закупка выпечки'],
  ['cleaning','Расходники для уборки']
];

const initial = () => ({
  settings: { name:'Бласт', tax:3, social:21675, schemaVersion:5, shares:[25,25,25,25], defaults:{} },
  months: { [FIRST]: blank() }
});

function blank(){
  return {
    kaspi:0, online:0, encashment:0,
    custom:[], employees:[],
    shares:[25,25,25,25],
    ...Object.fromEntries(baseCats.map(([k])=>[k,0]))
  };
}

/* ===== ЗАГРУЗКА СОСТОЯНИЯ ===== */
let state;
try {
  state = JSON.parse(localStorage.getItem(KEY)) || initial();
  if (!state.settings || !state.months) throw Error('bad');
} catch { state = initial(); }

if (!Number.isFinite(Number(state.settings.schemaVersion)) || Number(state.settings.schemaVersion) < 2){
  state.settings.social = 21675;
  state.settings.schemaVersion = 2;
}
state.settings.defaults ??= {};
state.settings.shares = validShares(state.settings.shares);
for (const m of Object.values(state.months)) m.shares = validShares(m.shares);
state.settings.schemaVersion = 5;

let current = Object.keys(state.months).sort().at(-1) || FIRST;
let tab = 'dashboard', range = 'year', start = FIRST, end = current;

/* ===== УТИЛИТЫ ===== */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n||0))+' ₸';
const num = n => Math.max(0, Number(n) || 0);
const pct = (n,d) => d ? ((n/d)*100).toFixed(1)+'%' : '0%';
const fmt = m => new Date(m+'-01T12:00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
const short = m => new Date(m+'-01T12:00:00').toLocaleDateString('ru-RU',{month:'short',year:'2-digit'});
const add = (m,n=1) => { const [y,mm]=m.split('-').map(Number); return new Date(Date.UTC(y,mm-1+n,1)).toISOString().slice(0,7); };
const monthList = () => Object.keys(state.months).filter(m=>m>=FIRST).sort();

const moneyShare = n => new Intl.NumberFormat('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2}).format(Math.round((n+Number.EPSILON)*100)/100)+' ₸';
const showPct = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n)+'%';

const shareNames = ['Жасталап','Асылхан','Дамир','На улучшение клуба'];
const shareColors = ['#7393ff','#65dfb5','#ffb978','#b49bff'];

function validShares(v){
  if (!Array.isArray(v) || v.length !== 4) return [25,25,25,25];
  const a = v.map(Number);
  return a.every(x=>Number.isFinite(x)&&x>=0&&x<=100) && Math.abs(a.reduce((x,y)=>x+y,0)-100)<.000001 ? a : [25,25,25,25];
}
function sharesOf(m){ return validShares(state.months[m]?.shares ?? state.settings.shares); }
function payrollTotal(m){ return (state.months[m]?.employees||[]).reduce((a,e)=>a+num(e.salary),0); }
function syncPayroll(m){ if (state.months[m]) state.months[m].payroll = payrollTotal(m); }

function normalizeEmployees(){
  for (const [m,d] of Object.entries(state.months)){
    if (!Array.isArray(d.employees)){
      const oldPay = num(d.payroll);
      d.employees = oldPay ? [{id:'imported-'+m, name:'Зарплаты (перенесено)', salary:oldPay}] : [];
    } else {
      d.employees = d.employees.filter(e=>e&&typeof e==='object').map((e,i)=>({
        id: String(e.id||'employee-'+i),
        name: String(e.name??'Сотрудник'),
        salary: num(e.salary)
      }));
    }
    syncPayroll(m);
  }
}
normalizeEmployees();

function stats(m){
  const d = state.months[m] || blank();
  const inc = num(d.kaspi)+num(d.online)+num(d.encashment);
  const ops = baseCats.reduce((s,[k])=>s+(k==='payroll'?payrollTotal(m):num(d[k])),0)
            + (d.custom||[]).reduce((s,c)=>s+num(c.value),0);
  const tax = inc * num(state.settings.tax) / 100;
  const social = num(state.settings.social);
  return {
    inc, ops, tax, social,
    expense: ops+tax+social,
    profit: inc-ops-tax-social,
    margin: inc ? (inc-ops-tax-social)/inc*100 : 0,
    kaspi: num(d.kaspi), online: num(d.online), encashment: num(d.encashment)
  };
}
const sum = ms => ms.reduce((a,m)=>{
  const s = stats(m);
  Object.keys(a).forEach(k => a[k] += s[k]||0);
  return a;
}, {inc:0,ops:0,tax:0,social:0,expense:0,profit:0,kaspi:0,online:0,encashment:0});

function allocation(s,m){
  const totalCents = Math.max(0, Math.round(s.profit*100));
  const percents = sharesOf(m);
  const raw = percents.map(p => totalCents*p/100);
  const cents = raw.map(Math.floor);
  const rest = totalCents - cents.reduce((x,y)=>x+y,0);
  const order = [0,1,2,3].sort((a,b)=>(raw[b]-cents[b])-(raw[a]-cents[a])||a-b);
  for (let i=0;i<rest;i++) cents[order[i%4]]++;
  return { distributable: totalCents/100, shares: cents.map(c=>c/100), percents };
}
function allocationsFor(ms){
  const shares = [0,0,0,0];
  let losses = 0;
  for (const m of ms){
    const s = stats(m), a = allocation(s,m);
    a.shares.forEach((v,i)=>shares[i]+=v);
    losses += Math.max(0,-s.profit);
  }
  return { shares: shares.map(v=>Math.round(v*100)/100), total: Math.round(shares.reduce((a,b)=>a+b,0)*100)/100, losses };
}

/* ===== SUPABASE ===== */
const cloudStatusEl = document.getElementById('cloudStatus');
const cloudTextEl = document.getElementById('cloudText');
function setCloudStatus(kind, text){
  cloudStatusEl.className = 'cloud-status ' + kind;
  cloudTextEl.textContent = text;
}

async function loadFromCloud(){
  try {
    setCloudStatus('saving', 'Загрузка…');
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${SUPABASE_ID}&select=data,updated_at`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    if (!rows.length || !rows[0].data || Object.keys(rows[0].data).length === 0){
      // В облаке пусто — заливаем текущее состояние
      setCloudStatus('saving', 'Первичная загрузка…');
      await saveToCloud(true);
      return;
    }
    const cloudData = rows[0].data;
    const cloudTime = new Date(rows[0].updated_at).getTime();
    const localTime = Number(localStorage.getItem(KEY+'_ts') || 0);
    if (cloudTime >= localTime){
      // Облако новее — берём его
      state = cloudData;
      if (!Number.isFinite(Number(state.settings.schemaVersion)) || Number(state.settings.schemaVersion)<2){
        state.settings.social = 21675;
        state.settings.schemaVersion = 2;
      }
      state.settings.defaults ??= {};
      state.settings.shares = validShares(state.settings.shares);
      for (const d of Object.values(state.months)) d.shares = validShares(d.shares);
      state.settings.schemaVersion = 5;
      normalizeEmployees();
      current = monthList().at(-1) || FIRST;
      localStorage.setItem(KEY, JSON.stringify(state));
      localStorage.setItem(KEY+'_ts', cloudTime);
      render();
      setCloudStatus('synced', 'Данные из облака');
    } else {
      // Локально новее — заливаем в облако
      await saveToCloud(true);
    }
  } catch (e){
    console.error('loadFromCloud error', e);
    setCloudStatus('error', 'Ошибка загрузки');
  }
}

let cloudSaveTimer = null;
async function saveToCloud(force=false){
  if (cloudSaveTimer){
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = null;
  }
  try {
    setCloudStatus('saving', 'Сохранение…');
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${SUPABASE_ID}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ data: state, updated_at: new Date().toISOString() })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    localStorage.setItem(KEY+'_ts', Date.now());
    setCloudStatus('synced', 'Синхронизировано');
  } catch (e){
    console.error('saveToCloud error', e);
    setCloudStatus('error', 'Ошибка сохранения');
  }
}

function scheduleCloudSave(){
  if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(()=>saveToCloud(true), CLOUD_SAVE_DELAY);
}

/* ===== АВТОСОХРАНЕНИЕ В ФАЙЛ ===== */
const DEFAULT_AUTOSAVE = { enabled:false, intervalDays:3, lastSaved:0 };
function getAutosaveSettings(){
  try {
    const s = JSON.parse(localStorage.getItem(AUTOSAVE_KEY));
    return Object.assign({}, DEFAULT_AUTOSAVE, s||{});
  } catch { return {...DEFAULT_AUTOSAVE}; }
}
function setAutosaveSettings(patch){
  const s = Object.assign(getAutosaveSettings(), patch);
  localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(s));
  return s;
}
function downloadJSON(){
  const content = JSON.stringify(state, null, 2);
  const blob = new Blob([content], {type:'application/json'});
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const name = `finance-autosave-${d.toISOString().slice(0,10)}.json`;
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  setAutosaveSettings({lastSaved: Date.now()});
}
function checkAutosave(){
  const s = getAutosaveSettings();
  if (!s.enabled) return;
  const elapsedDays = (Date.now() - s.lastSaved) / (1000*60*60*24);
  if (elapsedDays >= s.intervalDays){
    downloadJSON();
  }
}

/* ===== ПЕРИОДЫ ===== */
function period(){
  const ms = monthList();
  if (range === 'all') return ms;
  if (range === 'custom') return ms.filter(m => m>=start && m<=end);
  if (range === 'month') return ms.filter(m => m===current);
  if (range === 'quarter'){
    const [y,mo] = current.split('-').map(Number);
    const q = Math.floor((mo-1)/3);
    return ms.filter(m => m.slice(0,4)===String(y) && Math.floor((Number(m.slice(5))-1)/3)===q);
  }
  if (range === 'half'){
    const [y,mo] = current.split('-').map(Number);
    const h = Math.floor((mo-1)/6);
    return ms.filter(m => m.slice(0,4)===String(y) && Math.floor((Number(m.slice(5))-1)/6)===h);
  }
  return ms.filter(m => m.slice(0,4)===current.slice(0,4));
}

function chart(ms){
  if (!ms.length) return '<div class="empty">Нет данных за период</div>';
  const W=700,H=270,left=54,right=12,top=20,bottom=42;
  const iw=W-left-right, ih=H-top-bottom;
  const mx = Math.max(1, ...ms.flatMap(m=>{const s=stats(m);return [s.inc,s.profit];}));
  const mn = Math.min(0, ...ms.map(m=>stats(m).profit));
  const span = Math.max(1, mx-mn);
  const x = i => left + (ms.length===1 ? iw/2 : i*iw/(ms.length-1));
  const y = v => top + (mx-v)/span*ih;
  const line = k => ms.map((m,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(stats(m)[k]).toFixed(1)}`).join(' ');
  const ticks = [0,.25,.5,.75,1].map(t=>{
    const v = mn+(mx-mn)*t, Y = y(v);
    return `<line x1="${left}" y1="${Y}" x2="${W-right}" y2="${Y}" stroke="#304058" stroke-dasharray="4 6"/><text x="${left-9}" y="${Y+4}" text-anchor="end">${money(v).replace(' ₸','')}</text>`;
  }).join('');
  const labels = ms.filter((m,i)=>ms.length<=12||i%Math.ceil(ms.length/12)===0).map(m=>`<text x="${x(ms.indexOf(m))}" y="${H-12}" text-anchor="middle">${short(m)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График доходов и прибыли">
    ${ticks}
    <line x1="${left}" y1="${y(0)}" x2="${W-right}" y2="${y(0)}" stroke="#63738d"/>
    <path d="${line('inc')}" fill="none" stroke="#7393ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="${line('profit')}" fill="none" stroke="#65dfb5" stroke-width="3" stroke-linejoin="round"/>
    ${ms.map((m,i)=>`<circle cx="${x(i)}" cy="${y(stats(m).inc)}" r="4.5" fill="#7393ff"><title>${fmt(m)} · Доход ${money(stats(m).inc)}</title></circle><circle cx="${x(i)}" cy="${y(stats(m).profit)}" r="4.5" fill="#65dfb5"><title>${fmt(m)} · Прибыль ${money(stats(m).profit)}</title></circle>`).join('')}
    ${labels}
  </svg>
  <div class="legend"><span><i class="dot" style="background:#7393ff"></i>Доходы</span><span><i class="dot" style="background:#65dfb5"></i>Чистая прибыль</span></div>`;
}

function expLines(ms){
  const rows = baseCats.map(([k,name])=>({
    name,
    value: ms.reduce((a,m)=>a+(k==='payroll'?payrollTotal(m):num(state.months[m][k])),0)
  }));
  const social = num(state.settings.social)*ms.length;
  const tax = ms.reduce((a,m)=>a+stats(m).tax,0);
  rows.push({name:'Социальные отчисления', value:social});
  rows.push({name:'Резерв налога', value:tax});
  for (const m of ms){
    for (const c of state.months[m].custom||[]){
      const found = rows.find(r=>r.name===c.name);
      if (found) found.value += num(c.value);
      else rows.push({name:c.name||'Дополнительный расход', value:num(c.value)});
    }
  }
  return rows.filter(r=>r.value>0).sort((a,b)=>b.value-a.value);
}
