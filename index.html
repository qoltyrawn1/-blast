<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бласт — финансовый учёт</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Финансы">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%235574eb'/%3E%3Ctext x='90' y='125' font-size='110' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%82%B8%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Бласт — финансы","short_name":"Финансы","start_url":"./","display":"standalone","background_color":"%230b1220","theme_color":"%230b1220","icons":[{"src":"data:image/svg+xml,%253Csvg xmlns=%2527http://www.w3.org/2000/svg%2527 viewBox=%25270 0 512 512%2527%253E%253Crect width=%2527512%2527 height=%2527512%2527 rx=%2527100%2527 fill=%2527%25235574eb%2527/%253E%253Ctext x=%2527256%2527 y=%2527360%2527 font-size=%2527300%2527 text-anchor=%2527middle%2527 fill=%2527white%2527%253E%E2%82%B8%253C/text%253E%253C/svg%253E","sizes":"512x512","type":"image/svg+xml"}]}'>
<style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#e8edf6;background:#0b1220;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7c9cff;outline-offset:2px}
.shell{display:flex;min-height:100vh}
.side{width:245px;flex-shrink:0;background:#111b2d;padding:24px 17px;border-right:1px solid #263349;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:12px;align-items:center;font-size:18px;font-weight:800;margin-bottom:33px}
.mark{display:grid;place-items:center;background:#5574eb;border-radius:13px;width:41px;height:41px;font-size:23px}
.muted{color:#96a5bd}.mini{font-size:12px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{background:transparent;border:0;border-radius:11px;padding:13px 14px;color:#aab9cf;text-align:left}
.nav button.active,.nav button:hover{background:#243553;color:#fff}
.sidebar-foot{position:absolute;bottom:22px;left:26px;right:20px;line-height:1.65}
.main{width:100%;min-width:0;padding:34px clamp(18px,3.5vw,58px);max-width:1700px;margin:auto}
.top{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:25px;flex-wrap:wrap}
h1{font-size:28px;letter-spacing:-.7px;margin:0 0 6px}h2{font-size:18px;margin:0}p{margin:5px 0}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn,select,input{border:1px solid #34435c;background:#162339;color:#edf3ff;padding:10px 13px;border-radius:10px}
.btn{white-space:nowrap}.btn.primary{background:#5b77e9;border-color:#5b77e9;color:white}
.btn:hover{filter:brightness(1.13)}
.card{background:#162135;border:1px solid #27374f;border-radius:17px;padding:23px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.label{font-size:13px;color:#9badc6}
.value{font-size:clamp(19px,2.1vw,28px);font-weight:750;letter-spacing:-.7px;margin:12px 0 7px;overflow-wrap:anywhere}
.positive{color:#69deaf}.negative{color:#ffa29d}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:17px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.bar-row{display:grid;grid-template-columns:130px 1fr 115px;gap:14px;align-items:center;margin:16px 0;font-size:13px}
.track{background:#2a3851;height:10px;border-radius:20px;overflow:hidden}
.fill{height:100%;border-radius:20px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
td,th{padding:13px 9px;border-bottom:1px solid #2b3950;white-space:nowrap}
th{color:#9badc6;font-weight:500}
td:last-child,th:last-child{text-align:right}
tr.clickable{cursor:pointer}tr.clickable:hover{background:#202f48}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field label{font-size:12px;color:#aabbcf;display:block;margin:0 0 7px}
.field input{width:100%;font-variant-numeric:tabular-nums}
.field input:disabled{opacity:.6}
.field small{display:block;margin-top:4px;color:#90a3bc}
.total-strip{display:flex;justify-content:space-between;align-items:center;background:#21304a;border-radius:12px;padding:14px 18px;margin-top:17px;gap:12px}
.section{margin-top:18px}
.hint{font-size:12px;color:#9cabbe;line-height:1.55}
.tag{background:#243653;border:1px solid #38506e;border-radius:50px;padding:6px 10px;color:#b9cafa;font-size:12px}
.empty{padding:30px;text-align:center;color:#94a6be}
.chart{width:100%;height:270px;overflow:visible}
.chart text{font-size:11px;fill:#95a7c0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#a8b9d1}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.expense-line{display:flex;justify-content:space-between;gap:12px;font-size:13px;border-bottom:1px solid #2b3950;padding:8px 0}
.expense-line span:first-child{color:#aab9d0}
.danger{background:#422732;border-color:#754452}
.saved{color:#6bdbad}.hidden{display:none!important}
input[type=month],input[type=date]{color-scheme:dark}
::selection{background:#5878df}

/* Cloud status */
.cloud-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 11px;border-radius:50px;border:1px solid #38506e;background:#1d2d48;color:#b9cafa}
.cloud-status.synced{background:#1a3d33;border-color:#2f7a5e;color:#7fe4bc}
.cloud-status.saving{background:#3d331a;border-color:#7a662f;color:#f0d777}
.cloud-status.error{background:#3d1a1a;border-color:#7a2f2f;color:#f0a0a0}
.cloud-status.offline{background:#2a2a2a;border-color:#555;color:#bbb}

/* Распределение чистой прибыли */
.split-box{margin-top:18px;background:linear-gradient(125deg,#1a2c46,#162135 64%);border:1px solid #3a4b68;border-radius:17px;padding:22px;min-width:0}
.split-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:17px}
.split-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.split-card{border:1px solid #34445f;background:#101c30;border-radius:13px;padding:14px 15px;min-width:0;position:relative;overflow:hidden}
.split-card:before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--share-color)}
.split-card .split-amount{font-size:clamp(17px,1.7vw,23px);font-weight:760;letter-spacing:-.4px;margin-top:7px;overflow-wrap:anywhere}
.split-tag{font-size:12px;font-weight:700;color:#dfe7ff;background:#314364;padding:5px 9px;border-radius:7px}
.split-track{height:9px;width:100%;border-radius:50px;display:flex;overflow:hidden;margin:15px 0 10px;background:#293b56}
.split-track span{height:100%;transition:width .2s ease}
.split-info{font-size:12px;color:#a0b3cd;line-height:1.55}
.share-input-wrap{position:relative;max-width:145px;margin-top:10px}
.share-input-wrap input{width:100%;padding:9px 35px 9px 12px;font-size:17px;font-weight:700;min-width:0}
.share-input-wrap span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#a9bdd6;pointer-events:none}
.share-controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-top:13px}
.share-validation{font-size:13px;color:#94e2bf}
.share-validation.invalid{color:#ffaaa0}
.share-controls button:disabled{opacity:.45;cursor:not-allowed}
.share-settings{margin-top:18px}

.calculation{border:1px solid #30435e;background:#111e31;border-radius:13px;padding:17px;margin-top:18px}
.calc-row{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px;padding:7px 0;color:#becbe0}
.calc-row strong{color:#eff5ff;white-space:nowrap;font-variant-numeric:tabular-nums}
.calc-row.final{border-top:1px solid #34455f;margin-top:7px;padding-top:13px;font-size:15px;color:#f1f6ff;font-weight:750}

/* Зарплаты */
.payroll-link{width:100%;border:1px solid #435b80;border-radius:11px;background:#1d304d;color:#ecf5ff;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:12px 13px;transition:background .15s,border-color .15s}
.payroll-link:hover{background:#29436c;border-color:#7799ee}
.payroll-link strong{font-size:18px;font-variant-numeric:tabular-nums}
.payroll-link .go{font-size:12px;color:#a8c6ff;white-space:nowrap}
.employee-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(265px,1fr);gap:17px}
.employee-person{display:grid;grid-template-columns:45px minmax(0,1.4fr) minmax(160px,1fr) 38px;align-items:end;gap:12px;padding:14px 0;border-bottom:1px solid #2b3950}
.employee-person:last-child{border-bottom:0}
.employee-avatar{width:43px;height:43px;display:grid;place-items:center;background:#273d61;color:#bdd0ff;border-radius:13px;font-weight:750;align-self:center}
.employee-person .field input{width:100%}
.employee-remove{height:43px;padding:8px 0;font-size:23px}
.employee-stat{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #2a3952}
.employee-stat strong{font-variant-numeric:tabular-nums}
.employee-tip{background:#1d2d48;border:1px solid #324763;border-radius:12px;padding:14px 16px;margin-top:18px}
.employee-total{font-size:clamp(25px,3vw,36px);font-weight:760;color:#66dfb0;margin-top:8px;font-variant-numeric:tabular-nums}
.employee-empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:40px 18px;border:1px dashed #3d516e;border-radius:13px;color:#9fb1cb;margin-top:16px}
.employee-empty strong{color:#eff5ff}
.employee-empty .ico{font-size:32px}

/* Cloud & Autosave settings */
.cloud-box{border:1px solid #30435e;background:#111e31;border-radius:13px;padding:18px;margin-top:18px}
.cloud-box h3{margin:0 0 10px;font-size:15px}
.cloud-box .controls{margin-top:14px}
.cloud-box label{display:flex;align-items:center;gap:10px;font-size:13px;color:#becbe0;padding:8px 0;cursor:pointer}
.cloud-box input[type=checkbox]{width:18px;height:18px;accent-color:#5b77e9}
.cloud-box input[type=text]{width:100%;font-family:monospace;font-size:12px}
.cloud-box .field{margin-top:10px}

@media(max-width:1060px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:650px){.shell{display:block}.side{height:auto;width:auto;position:relative;padding:12px 16px;border-right:0;border-bottom:1px solid #263349}.logo{margin:0 0 10px;font-size:16px}.sidebar-foot{display:none}.nav{flex-direction:row;overflow:auto}.nav button{padding:10px 12px;white-space:nowrap}.main{padding:20px 14px}.top h1{font-size:23px}.kpis,.rows{grid-template-columns:1fr 1fr}.card{padding:15px}.bar-row{grid-template-columns:82px 1fr 82px;gap:8px;font-size:11px}.value{font-size:21px}}
@media(max-width:410px){.kpis,.rows{grid-template-columns:1fr}}
@media(max-width:1000px){.split-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:500px){.split-box{padding:15px}.split-grid{grid-template-columns:1fr 1fr;gap:8px}.split-card{padding:12px}.split-card .split-amount{font-size:16px}}
@media(max-width:365px){.split-grid{grid-template-columns:1fr}}
@media(max-width:1100px){.employee-grid{grid-template-columns:1fr}}
@media(max-width:600px){.employee-person{grid-template-columns:38px minmax(0,1fr) 34px;gap:9px}.employee-avatar{width:38px;height:38px}.employee-person .salary-field{grid-column:2;grid-row:2}.employee-remove{grid-column:3;grid-row:1;align-self:end}.employee-person .name-field{grid-column:2;grid-row:1}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
<div class="logo"><span class="mark">₸</span><span id="brand">Бласт</span></div>
<nav class="nav" id="nav">
<button data-tab="dashboard" class="active">◫ &nbsp; Обзор</button>
<button data-tab="months">▦ &nbsp; Месяцы</button>
<button data-tab="employees">♧ &nbsp; Сотрудники</button>
<button data-tab="analytics">◷ &nbsp; Аналитика</button>
<button data-tab="settings">⚙ &nbsp; Настройки</button>
</nav>
<div class="sidebar-foot mini muted">
<div class="cloud-status" id="cloudStatus" title="Состояние синхронизации">☁ <span id="cloudText">Загрузка…</span></div>
<br><br>Управленческий учёт<br>Данные в облаке и локально
</div>
</aside>
<main class="main">
<div class="top">
<div><h1 id="page-title">Финансовая панель</h1><p class="muted" id="page-sub">Показатели вашего бизнеса</p></div>
<div class="controls" id="top-controls">
<select id="monthSelect" aria-label="Месяц"></select>
<button class="btn primary" id="newMonth">+ Следующий месяц</button>
</div>
</div>
<div id="content"></div>
</main>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
